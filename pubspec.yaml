name: getpagar_lens
description: 'GetPagar Lens attandence system application.'
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_commons: ^0.11.1
  permission_handler: ^12.0.1
  dio: ^5.9.0
  shared_preferences: ^2.5.5
  pretty_dio_logger:
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  image_picker: ^1.1.2

  flutter_image_compress:
  path_provider:
  intl: ^0.19.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_dotenv: ^6.0.1
  excel: ^4.0.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename:
  flutter_launcher_icons:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon.png'

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
